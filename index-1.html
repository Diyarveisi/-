<title>داروخانه ایرانخودرو</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
:root{--bg:#070b14;--ink:#e9f0ff;--dim:#8d9ab8;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.055);--cy:#25f4d0;--am:#ffb020;--rose:#ff4f81;--vi:#8b7bff}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;min-height:100dvh;
 background-image:radial-gradient(60rem 40rem at 90% -10%,rgba(37,244,208,.14),transparent 60%),radial-gradient(50rem 40rem at -10% 110%,rgba(139,123,255,.16),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
small{display:block;color:var(--dim);font-size:12px;line-height:1.5}
h2{font-size:17px;font-weight:700}
h3{font-size:18px;margin-bottom:12px}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100dvh}
nav.side{position:sticky;top:0;height:100dvh;padding:16px 12px;border-inline-end:1px solid var(--line);background:rgba(8,12,22,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:6px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-weight:800;line-height:1.3}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 8px rgba(37,244,208,.6))}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--dim);position:relative;transition:.18s}
.nb:hover{background:var(--glass);color:var(--ink)}
.nb.on{background:linear-gradient(90deg,rgba(37,244,208,.16),rgba(37,244,208,.04));color:var(--cy);box-shadow:inset 0 0 0 1px rgba(37,244,208,.35),0 0 18px rgba(37,244,208,.15)}
.nb i{font-style:normal;font-size:19px}
.nb b{position:absolute;inset-inline-end:10px;background:var(--rose);color:#fff;border-radius:99px;font-size:11px;min-width:20px;text-align:center;padding:0 5px;box-shadow:0 0 12px var(--rose)}
.nb b:empty{display:none}
.kb{margin-top:auto;font-size:11px;color:var(--dim);line-height:1.9;padding:10px;border:1px dashed var(--line);border-radius:12px}
kbd{background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:0 5px;font:inherit;font-size:11px}
main{min-width:0;padding:0 20px 40px}
header.top{position:sticky;top:0;z-index:15;display:flex;gap:10px;align-items:center;padding:14px 0 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.sw{position:relative;flex:1;min-width:0}
#q{width:100%;padding:12px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:16px}
#q:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px rgba(37,244,208,.18),0 0 24px rgba(37,244,208,.18)}
.sr{position:absolute;top:calc(100% + 8px);inset-inline:0;background:rgba(14,19,33,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;max-height:65vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:30;padding:6px}
.sri{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;align-items:center}
.sri:hover,.sri.on{background:rgba(37,244,208,.1)}
.sri .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.alt{color:var(--am)}
.alt span{text-decoration:underline;cursor:pointer}
.ib{width:44px;height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:18px;flex:none}
.ib:hover{border-color:var(--cy)}
#net{font-size:11px;color:var(--dim);white-space:nowrap}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.ph{margin-bottom:14px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.g{gap:8px}.wrap{flex-wrap:wrap}.end{justify-content:flex-end;margin-top:16px}
.btn{padding:10px 18px;border-radius:14px;font-weight:700;color:#04121a;background:linear-gradient(135deg,var(--cy),#5af0ff);box-shadow:0 0 22px rgba(37,244,208,.35);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(37,244,208,.55)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{color:var(--rose);border-color:rgba(255,79,129,.4)}
.btn.big{width:100%;padding:16px;font-size:17px}
.mini{width:34px;height:34px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.mini:hover{border-color:var(--cy)}
.in{width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.in:focus{outline:0;border-color:var(--cy)}
select.in option{background:#101728}
label{display:block;font-size:13px;color:var(--dim)}
label .in{margin-top:4px;color:var(--ink);font-size:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span{grid-column:1/-1}
.tw{overflow:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--dim);font-size:12px;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover{background:rgba(255,255,255,.04)}
.tbl input.n{width:64px;text-align:center;padding:6px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.tbl input.n.w{width:110px}
.x{color:var(--rose);width:30px;height:30px;border-radius:9px}.x:hover{background:rgba(255,79,129,.15)}
.warn{color:var(--am)}
.tag{display:inline-block;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.ok{color:var(--cy);background:rgba(37,244,208,.12)}
.tag.low{color:var(--am);background:rgba(255,176,32,.14)}
.tag.out{color:var(--rose);background:rgba(255,79,129,.14)}
.empty{color:var(--dim);text-align:center;padding:20px 10px}.empty.big{padding:60px 10px}
.grid2{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.sum{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay button{padding:9px 4px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.pay button.on{border-color:var(--cy);color:var(--cy);background:rgba(37,244,208,.1);box-shadow:0 0 16px rgba(37,244,208,.2)}
.tot{display:flex;justify-content:space-between;color:var(--dim)}
.tot.f{color:var(--ink);font-size:20px;font-weight:800;padding-top:8px;border-top:1px dashed var(--line)}
.tot.f span:last-child{color:var(--cy);text-shadow:0 0 16px rgba(37,244,208,.6)}
.grid-inv{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.cat{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:12px;cursor:pointer;color:var(--dim)}
.cat:hover{background:var(--glass)}.cat.on{background:rgba(37,244,208,.12);color:var(--cy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mc{text-align:start;display:flex;flex-direction:column;gap:2px}
.mc:hover{border-color:var(--cy)}
.bal{margin-top:8px;display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px}
.bal strong{font-size:18px;color:var(--ink)}
.bal.debt strong{color:var(--rose);text-shadow:0 0 14px rgba(255,79,129,.5)}.bal.cred strong{color:var(--cy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st b{display:block;font-size:22px;line-height:1.3}.st span{color:var(--dim);font-size:12px}
.st.pr b{color:var(--cy);text-shadow:0 0 16px rgba(37,244,208,.5)}.st.rd b{color:var(--rose)}
.dg{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.ch{width:100%;height:auto;margin-top:8px}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px}.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.pos{color:var(--cy)}.neg{color:var(--rose)}
.mod{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fd .15s}
.mbox{width:min(640px,100%);max-height:92dvh;overflow:auto;background:rgba(16,22,38,.96);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 40px rgba(37,244,208,.08);animation:pop .2s cubic-bezier(.2,1.2,.4,1)}
@keyframes fd{from{opacity:0}}@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:rgba(255,176,32,.12);color:var(--am);border-radius:99px;padding:2px 6px 2px 12px;display:flex;gap:6px;align-items:center;font-size:13px}
.chip button{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1)}
.icons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ic input{display:none}.ic span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:20px;cursor:pointer}
.ic input:checked+span{border-color:var(--cy);box-shadow:0 0 14px rgba(37,244,208,.4)}
.vid{width:100%;border-radius:16px;background:#000;margin-bottom:12px;aspect-ratio:4/3;object-fit:cover}
.toast{position:fixed;inset-inline:0;bottom:90px;margin-inline:auto;width:max-content;max-width:90vw;z-index:80;padding:10px 20px;border-radius:99px;background:rgba(16,22,38,.96);border:1px solid var(--cy);box-shadow:0 0 30px rgba(37,244,208,.35);animation:tin .25s}
.toast.bad{border-color:var(--rose);box-shadow:0 0 30px rgba(255,79,129,.4)}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
.sheet{background:#fff;color:#111;border-radius:14px;padding:22px;font-size:13px;line-height:1.8}
.sh-h{display:flex;gap:14px;align-items:center;border-bottom:3px solid #111;padding-bottom:12px}
.sh-h h1{font-size:22px}.sh-h p{color:#555}
.sh-h .logo svg{width:54px;height:54px}
.sh-m{margin-inline-start:auto;display:flex;flex-direction:column;text-align:end}
.sh-i{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0}

 .app{grid-template-columns:minmax(0,1fr)}

 .brand,.kb{display:none}
 .nb{flex-direction:column;gap:0;padding:6px 0;font-size:10.5px;line-height:1.5;justify-content:center;align-items:center;text-align:center;min-width:0;border-radius:12px}

<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main>
    <header class="top">
      <div class="sw">
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="استعلام سریع: نام، کد فنی، بارکد، خودرو…  (F2)">
        <div class="sr" id="sr" hidden></div>
      </div>
      <button class="ib" data-act="scan" title="اسکن بارکد با دوربین" aria-label="اسکن بارکد">📷</button>
      <button class="ib" data-act="settings" title="تنظیمات" aria-label="تنظیمات">⚙️</button>
      <span id="net"></span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="printroot"></div>

<script>
'use strict';
/* ---------- ابزارها ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s??'').toLowerCase().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim();
const num=s=>+norm(s).replace(/[,٬،]/g,'')||0;
const fmt=n=>Number(n||0).toLocaleString('en-US');
const moneyIn=(name,val,attrs='')=>`<div class="mw"><input class="in money" ${name?`name="${name}"`:''} ${attrs} inputmode="numeric" autocomplete="off" value="${val?fmt(val):''}"><button type="button" class="z" data-act="zeros" tabindex="-1" aria-label="سه صفر">۰۰۰</button></div>`;
const jdate=(t,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o||{dateStyle:'medium'}).format(new Date(t));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const METH={cash:'نقدی',card:'کارتخوان',credit:'نسیه / روی حساب'};
const ICONS=['🚗','🚙','🚘','🚐','🛻','🏎️','⚙️','🔩','🛞','⚡','🛑','🛢️','🔧','🧰','💡','❄️','🪟','📁'];
const TABS=[{id:'sale',t:'فروش',i:'🧾'},{id:'inv',t:'انبار',i:'📦'},{id:'mech',t:'مکانیک‌ها',i:'🔧'},{id:'invs',t:'فاکتورها',i:'📑'},{id:'stock',t:'انبارگردانی',i:'✅'},{id:'dash',t:'داشبورد',i:'📊'}];
const LOGO='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M32 6l22 13v26L32 58 10 45V19z"/><path d="M32 22v20M22 32h20"/></svg>';

/* ---------- ذخیره‌سازی آفلاین (IndexedDB) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('irankhodro-pharmacy',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
const DEF=()=>({v:2,updatedAt:0,seq:1001,cats:[],parts:[],mechs:[],invoices:[],payments:[],audits:[],
  draft:{items:[],mech:'',buyer:'',kind:'walk',method:'cash',discount:0},
  settings:{shop:'داروخانه ایرانخودرو',addr:'',phone:'',sound:true,syncUrl:'',token:''},
  ui:{tab:'sale',cat:'',pf:''}});
const hydrate=s=>{const d=DEF();return {...d,...s,draft:{...d.draft,...s.draft},settings:{...d.settings,...s.settings},ui:{...d.ui,...s.ui}}};
let S=null;const U={sel:0,res:[],counts:{},alts:[],sf:'',iff:''};
let saveT,pushT;
function save(){S.updatedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',S).catch(()=>toast('ذخیره‌سازی مرورگر پر یا غیرفعال است',1)),150);clearTimeout(pushT);pushT=setTimeout(push,2000)}

/* ---------- همگام‌سازی اختیاری با سرور ---------- */
const base=()=>(S.settings.syncUrl||'').replace(/\/+$/,'');
const hdr=()=>({'content-type':'application/json',...(S.settings.token?{'x-token':S.settings.token}:{})});
const net=t=>{$('#net').textContent=(navigator.onLine?'🟢 آنلاین':'🟠 آفلاین')+(t?' · '+t:'')};
async function pull(){
  if(!base()||!navigator.onLine)return;
  try{
    const r=await fetch(base()+'/api/state',{headers:hdr()});if(!r.ok)throw 0;const s=await r.json();
    if(s.updatedAt&&s.updatedAt>S.updatedAt){const k=S.settings;S=hydrate(s);S.settings={...S.settings,syncUrl:k.syncUrl,token:k.token};await DB.set('state',S);render();net('همگام ✓')}
    else if(S.updatedAt>(s.updatedAt||0))push();else net('همگام ✓');
  }catch{net('خطای همگام‌سازی')}
}
async function push(){
  if(!base()||!navigator.onLine)return;
  try{const r=await fetch(base()+'/api/state',{method:'PUT',headers:hdr(),body:JSON.stringify(S)});net(r.ok?'همگام ✓':'خطای همگام‌سازی')}catch{net('خطای همگام‌سازی')}
}
addEventListener('online',()=>{net();pull()});addEventListener('offline',()=>net());

/* ---------- صدا ---------- */
let AC;
function beep(seq){
  if(!S.settings.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime;
    seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8});}catch{}
}
const sfx={add:()=>beep([[880,.07,'square'],[1320,.09,'square']]),done:()=>beep([[988,.09,'square'],[1319,.09,'square'],[1568,.2,'square']]),err:()=>beep([[220,.22,'sawtooth']])};
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- داده‌ی نمونه ---------- */
const BRANCHES=[['پراید','🚘'],['پیکان','🚗'],['پژو','🚙'],['سمند','🚙'],['ال نود (L90)','🚐'],['۲۰۶','🏎️'],['تیبا','🚘'],['ساینا','🚘'],['پارس ELX','🚙'],['پارس','🚙']];
function ensureBranches(){BRANCHES.forEach(([n,i])=>{if(!S.cats.some(c=>!c.parent&&norm(c.name)===norm(n)))S.cats.push({id:uid(),name:n,icon:i,parent:''})})}
function seed(){ensureBranches()}
function isDemo(){return !S.invoices.length&&!S.payments.length&&S.cats.some(c=>c.id==='c1')&&S.parts.every(p=>/^62600010000/.test(p.barcode))}

/* ---------- کمک‌تابع‌های داده ---------- */
const partById=id=>S.parts.find(p=>p.id===id);
const catById=id=>S.cats.find(c=>c.id===id);
const mechById=id=>S.mechs.find(m=>m.id===id);
const desc=id=>{const o=[];S.cats.filter(c=>c.parent===id).forEach(c=>{o.push(c.id,...desc(c.id))});return o};
const catPath=id=>{const o=[];let c=catById(id);while(c){o.unshift(c.name);c=catById(c.parent)}return o.join(' › ')};
const countIn=id=>{const ids=[id,...desc(id)];return S.parts.filter(p=>ids.includes(p.cat)).length};
const sc=p=>p.stock<=0?'out':p.stock<=p.min?'low':'ok';
const bal=mid=>S.invoices.filter(i=>!i.void&&i.mech===mid&&i.method==='credit').reduce((s,i)=>s+i.total,0)-S.payments.filter(p=>p.mech===mid).reduce((s,p)=>s+p.amount,0);
const cartSub=()=>S.draft.items.reduce((s,x)=>s+x.qty*x.price,0);
function findParts(q){
  q=norm(q);if(!q)return[];const w=q.split(' ');
  const ex=S.parts.filter(p=>p.barcode===q||norm(p.code)===q);
  const rest=S.parts.filter(p=>!ex.includes(p)&&w.every(x=>norm([p.name,p.code,p.barcode,p.car,catPath(p.cat)].join(' ')).includes(x)));
  return [...ex,...rest].slice(0,12);
}
function setAlts(p,ids){
  S.parts.forEach(x=>{if(x.id===p.id)return;const has=x.alts.includes(p.id),want=ids.includes(x.id);if(want&&!has)x.alts.push(p.id);if(!want&&has)x.alts=x.alts.filter(i=>i!==p.id)});
  p.alts=[...ids];
}
function catOpts(sel,exclude){
  const bad=exclude?[exclude,...desc(exclude)]:[];
  return S.cats.filter(c=>!bad.includes(c.id)).map(c=>({id:c.id,p:catPath(c.id)})).sort((a,b)=>a.p.localeCompare(b.p,'fa')).map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.p)}</option>`).join('');
}

/* ---------- سبد فاکتور ---------- */
function addToCart(id){
  const p=partById(id);if(!p)return;
  const it=S.draft.items.find(x=>x.pid===id);
  if(it)it.qty++;else S.draft.items.push({pid:id,name:p.name,qty:1,price:p.sell,buy:p.buy});
  const cur=S.draft.items.find(x=>x.pid===id);
  if(cur.qty>p.stock){toast('موجودی کافی نیست ('+fa(p.stock)+' عدد)',1);sfx.err()}else{sfx.add();toast('به فاکتور افزوده شد')}
  save();if(S.ui.tab==='sale')render();else updBadge();
}
function finalize(){
  const d=S.draft;
  if(!d.items.length){toast('فاکتور خالی است',1);sfx.err();return}
  let mech=null;const walk=d.kind!=='mech';const mn=walk?'':(d.mech||'').trim();
  if(walk&&d.method==='credit')d.method='cash';
  if(!walk&&!mn){toast('نام مکانیک را وارد کن',1);sfx.err();return}
  if(mn){mech=S.mechs.find(m=>norm(m.name)===norm(mn));if(!mech){mech={id:uid(),name:mn,phone:''};S.mechs.push(mech)}}
  if(d.method==='credit'&&!mech){toast('برای نسیه، نام مکانیک را وارد کنید',1);sfx.err();return}
  const sub=cartSub(),disc=Math.min(num(d.discount),sub);
  const inv={id:uid(),no:S.seq++,date:Date.now(),mech:mech?mech.id:'',mechName:mech?mech.name:'',buyer:d.buyer||'',method:d.method,discount:disc,total:sub-disc,items:d.items.map(x=>({...x}))};
  inv.items.forEach(x=>{const p=partById(x.pid);if(p)p.stock-=x.qty});
  S.invoices.push(inv);S.draft={items:[],mech:'',buyer:'',kind:'walk',method:'cash',discount:0};
  save();sfx.done();render();showInv(inv.id);
}

/* ---------- مودال ---------- */
function openModal(html){closeModal();const m=document.createElement('div');m.className='mod';m.id='mod';m.innerHTML='<div class="mbox">'+html+'</div>';m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);const f=m.querySelector('input:not([type=hidden]):not([type=radio]),select');if(f&&innerWidth>900)f.focus()}
function closeModal(){U.fromSale=false;if(U.stopScan){U.stopScan();U.stopScan=null}const m=$('#mod');if(m)m.remove()}

/* ---------- نماها ---------- */
const V={};
V.sale=()=>{
  const d=S.draft,sub=cartSub(),disc=Math.min(num(d.discount),sub),mech=d.kind==='mech';
  const lines=d.items.map((it,i)=>{const p=partById(it.pid);const low=p&&it.qty>p.stock;
    return `<div class="cl"><div class="nm"><b>${esc(it.name)}</b><button class="x" data-act="del" data-i="${i}" aria-label="حذف">✕</button></div>${low?`<small class="warn">موجودی فقط ${fa(p.stock)} عدد</small>`:''}
    <div class="ctl"><div class="step"><button data-act="dec" data-i="${i}" aria-label="کم">−</button><input class="n" inputmode="numeric" data-in="qty" data-i="${i}" value="${it.qty}" aria-label="تعداد"><button data-act="inc" data-i="${i}" aria-label="زیاد">+</button></div>
    <input class="in money pr" inputmode="numeric" data-in="price" data-i="${i}" value="${fmt(it.price)}" aria-label="قیمت واحد (ریال)"><span class="sm">${fa(it.qty*it.price)}</span></div></div>`}).join('');
  const methods=(mech?['credit','cash','card']:['cash','card']).map(k=>`<button class="${d.method===k?'on':''}" data-act="method" data-v="${k}">${METH[k]}</button>`).join('');
  return `<div class="sale">
  <section class="card cust"><div class="row between wrap g"><h2>۱. مشتری</h2><button class="btn ghost" data-act="clearcart">فروش جدید</button></div>
   <div class="seg" style="margin-top:10px"><button class="${!mech?'on':''}" data-act="kind" data-v="walk">🚶 رهگذر / مشتری متفرقه</button><button class="${mech?'on':''}" data-act="kind" data-v="mech">🔧 مکانیک / حساب دفتری</button></div>
   ${mech?`<label style="margin-top:10px">نام مکانیک (مثلاً کبرا)<div class="mw"><input class="in" list="ml" data-in="draft" data-k="mech" value="${esc(d.mech)}" placeholder="انتخاب یا نوشتن نام"><button type="button" class="z" data-act="newmechsale" aria-label="حساب جدید">＋</button></div></label>
   <datalist id="ml">${S.mechs.map(m=>`<option value="${esc(m.name)}">`).join('')}</datalist>
   <label style="margin-top:10px">توضیح — اختیاری (مثلاً: برای پژو آقای احمدی)<input class="in" data-in="draft" data-k="buyer" value="${esc(d.buyer)}"></label>
   <div class="hint">هرچه این مکانیک بردارد روی حساب خودش ثبت می‌شود و بعداً از بخش «مکانیک‌ها» تسویه می‌کنی.</div>`
   :`<label style="margin-top:10px">نام — اختیاری<input class="in" data-in="draft" data-k="buyer" value="${esc(d.buyer)}"></label>
   <div class="hint">برای کسی که یک قطعه می‌خرد و می‌رود: فقط اقلام را بزن و ثبت کن.</div>`}
  </section>
  <section class="card"><h2>۲. اقلام</h2>
   <form id="mi"><input class="in" name="name" list="pl2" data-inp="iname" autocomplete="off" required placeholder="نام قطعه یا کالا را بنویس (از انبار یا هر چیز دلخواه)" style="margin-top:10px">

function line(days){
  const W=320,H=120,mx=Math.max(1,...days.map(d=>d.v)),n=days.length;
  const pts=days.map((d,i)=>[W-i*W/(n-1),H-8-(d.v/mx)*(H-28)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const lb=(i,a)=>`<text x="${pts[i][0]}" y="${H+14}" fill="#8d9ab8" font-size="9" text-anchor="${a}">${jdate(days[i].t,{month:'numeric',day:'numeric'})}</text>`;
  return `<svg viewBox="0 0 ${W} ${H+18}" class="ch" role="img" aria-label="نمودار فروش ۱۴ روز اخیر"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25f4d0" stop-opacity=".35"/><stop offset="1" stop-color="#25f4d0" stop-opacity="0"/></linearGradient><filter id="gl" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="${path}L0 ${H}L${W} ${H}Z" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#25f4d0" stroke-width="2.5" stroke-linejoin="round" filter="url(#gl)"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#07101a" stroke="#25f4d0" stroke-width="1.5"/>`).join('')}${lb(0,'end')}${lb(Math.floor(n/2),'middle')}${lb(n-1,'start')}</svg>`;
}
function donut(top){
  const C=2*Math.PI*42,tot=top.reduce((s,t)=>s+t[1],0)||1,col=['#25f4d0','#8b7bff','#ffb020','#ff4f81','#5ab0ff'];let off=0;
  const segs=top.map((t,i)=>{const l=t[1]/tot*C;const s=`<circle r="42" cx="60" cy="60" fill="none" stroke="${col[i]}" stroke-width="14" stroke-dasharray="${l.toFixed(1)} ${(C-l).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 4px ${col[i]})"/>`;off+=l;return s}).join('');
  return `<svg viewBox="0 0 120 120" style="width:150px;display:block;margin:6px auto" role="img" aria-label="پرفروش‌ترین قطعات"><circle r="42" cx="60" cy="60" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14"/>${segs}</svg>`+top.map((t,i)=>`<div class="leg"><i style="background:${col[i]}"></i><span>${esc(t[0])}</span><small style="margin-inline-start:auto">${fa(t[1])}</small></div>`).join('');
}
V.dash=()=>{

};

async function scan(){
  if(!('BarcodeDetector' in window)){toast('این مرورگر اسکن دوربین ندارد؛ با بارکدخوان داخل کادر جستجو اسکن کنید',1);$('#q').focus();return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch{toast('دسترسی به دوربین داده نشد',1);return}
  openModal('<h3>اسکن بارکد</h3><video id="vid" playsinline muted autoplay class="vid"></video><button class="btn ghost" data-act="close">بستن</button>');
  const v=$('#vid');v.srcObject=stream;const det=new BarcodeDetector();let on=true;
  U.stopScan=()=>{on=false;stream.getTracks().forEach(t=>t.stop())};
  const loop=async()=>{if(!on)return;try{const r=await det.detect(v);if(r[0]){const code=r[0].rawValue,p=S.parts.find(x=>x.barcode===code);if(p)addToCart(p.id);else{toast('بارکد ناشناخته: '+code,1);sfx.err()}await sleep(1300)}}catch{}if(on)requestAnimationFrame(loop)};
  v.onplaying=loop;
}

function snapBulk(){S.bulkUndo={at:Date.now(),parts:JSON.parse(JSON.stringify(S.parts)),cats:JSON.parse(JSON.stringify(S.cats))}}
function parseTable(text){
  text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0]||'';
  const del=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
const COLS={name:['نام','نام قطعه','نام کالا','شرح','name'],code:['کد','کد فنی','code'],barcode:['بارکد','barcode'],branch:['شاخه','خودرو','ماشین','برند','branch','car'],sub:['زیرشاخه','گروه','دسته','دسته بندی','sub','group'],buy:['خرید','قیمت خرید','buy'],sell:['فروش','قیمت فروش','قیمت','sell','price'],stock:['موجودی','تعداد','stock','qty'],min:['حداقل','حد هشدار','min']};
function mapCols(hdr){const m={};hdr.forEach((h,i)=>{const n=norm(h).replace(/[\u200c_-]/g,' ').trim();for(const k in COLS)if(m[k]===undefined&&COLS[k].some(a=>norm(a)===n))m[k]=i});return m}
function planImport(rows,toman){
  let m=mapCols(rows[0]),data=rows.slice(1);
  if(m.name===undefined){m={name:0,code:1,branch:2,sub:3,buy:4,sell:5,stock:6};data=rows}
  const mul=toman?10:1,out={skip:0,items:[]};
  data.forEach(r=>{const g=k=>m[k]===undefined?'':String(r[m[k]]==null?'':r[m[k]]).trim();const name=g('name');if(!name){out.skip++;return}
    out.items.push({name,code:g('code'),barcode:norm(g('barcode')).replace(/\s/g,''),branch:g('branch'),sub:g('sub'),buy:num(g('buy'))*mul,sell:num(g('sell'))*mul,stock:g('stock')===''?null:num(g('stock')),min:g('min')===''?null:num(g('min'))})});
  return out;
}
const topName=id=>{let c=catById(id),t='';while(c){t=norm(c.name);c=catById(c.parent)}return t};
function addIdx(ix,p){const b=topName(p.cat);if(p.barcode)ix.bc.set(p.barcode,p);if(p.code)ix.cd.set(norm(p.code)+'|'+b,p);ix.nm.set(norm(p.name)+'|'+b,p)}
function buildIdx(){const ix={bc:new Map(),cd:new Map(),nm:new Map()};S.parts.forEach(p=>addIdx(ix,p));return ix}
function matchIdx(ix,o){const b=norm(o.branch);return (o.barcode&&ix.bc.get(o.barcode))||(o.code&&ix.cd.get(norm(o.code)+'|'+b))||ix.nm.get(norm(o.name)+'|'+b)||null}
function startImport(txt,inputEl){
  const toman=!!($('#toman')&&$('#toman').checked);const rows=parseTable(txt||'');if(inputEl)inputEl.value='';
  if(!rows.length)return toast('متنی پیدا نشد',1);
  U.imp=planImport(rows,toman);if(!U.imp.items.length)return toast('ردیفی پیدا نشد؛ عنوان ستون‌ها را چک کن',1);
  const ix=buildIdx();let add=0,upd=0;U.imp.items.forEach(o=>matchIdx(ix,o)?upd++:add++);
  openModal(`<h3>بررسی قبل از ورود</h3><div class="stats"><div class="card st pr"><b>${fa(add)}</b><span>قطعه‌ی جدید</span></div><div class="card st"><b>${fa(upd)}</b><span>بروزرسانی موجود</span></div><div class="card st rd"><b>${fa(U.imp.skip)}</b><span>ردیف بدون نام (ردشده)</span></div></div>

   <div class="hint">قیمت‌ها${toman?' (تومان ×۱۰)':''} به ریال وارد می‌شن. قبل از ورود نسخه‌ی فعلی ذخیره می‌شه و از «ابزار انبار» قابل برگشته.</div>

}
function applyImport(){
  const pl=U.imp;if(!pl)return;snapBulk();const ix=buildIdx();let add=0,upd=0;
  const ensureCat=(branch,sub)=>{if(!branch)return '';let b=S.cats.find(c=>!c.parent&&norm(c.name)===norm(branch));if(!b){b={id:uid(),name:branch,icon:'🚗',parent:''};S.cats.push(b)}let id=b.id;

  pl.items.forEach(o=>{const cat=ensureCat(o.branch,o.sub),p=matchIdx(ix,o);
    if(p){if(o.buy)p.buy=o.buy;if(o.sell)p.sell=o.sell;if(o.stock!==null)p.stock=o.stock;if(o.min!==null)p.min=o.min;if(o.code)p.code=o.code;if(o.barcode)p.barcode=o.barcode;if(cat&&!p.cat)p.cat=cat;upd++}
    else{const n={id:uid(),name:o.name,code:o.code,barcode:o.barcode,car:o.branch,cat,buy:o.buy,sell:o.sell,stock:o.stock===null?0:o.stock,min:o.min===null?2:o.min,alts:[]};S.parts.push(n);addIdx(ix,n);add++}});
  U.imp=null;save();closeModal();render();sfx.done();toast(fa(add)+' جدید، '+fa(upd)+' بروزرسانی');
}

  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}

}

    box.innerHTML=r.map(p=>`<div class="sri" data-act="pickname" data-id="${p.id}"><div><b>${esc(p.name)}</b><small>${esc(catPath(p.cat))}</small></div><div class="r"><span class="tag ${sc(p)}">${p.stock<=0?'ناموجود':fa(p.stock)}</span><b>${fa(p.sell)}</b></div></div>`).join('')},
  altin:t=>{const p=S.parts.find(x=>norm(x.name)===norm(t.value));if(p&&!U.alts.includes(p.id)){U.alts.push(p.id);t.value='';$('#chips').innerHTML=chipsHTML()}}
};
const H={ // submit
  pf:f=>{const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
    const o={name:d.name.trim(),code:d.code.trim(),barcode:norm(d.barcode).replace(/\s/g,''),car:d.car.trim(),cat:d.cat,buy:num(d.buy),sell:num(d.sell),stock:num(d.stock),min:num(d.min)};
    if(o.barcode&&S.parts.some(x=>x.barcode===o.barcode&&x.id!==id))return toast('این بارکد برای قطعه‌ی دیگری ثبت شده',1);
    let p=id&&partById(id);if(p)Object.assign(p,o);else{p={id:uid(),alts:[],...o};S.parts.push(p)}
    setAlts(p,U.alts);save();closeModal();render();toast('ذخیره شد')},
  cf:f=>{const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;const c=id&&catById(id);
    if(c){c.name=d.name.trim();c.icon=d.icon;c.parent=d.parent}else S.cats.push({id:uid(),name:d.name.trim(),icon:d.icon,parent:d.parent});
    save();closeModal();render()},
  mf:f=>{const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;const m=id&&mechById(id);
    if(m){m.name=d.name.trim();m.phone=d.phone.trim()}else{S.mechs.push({id:uid(),name:d.name.trim(),phone:d.phone.trim()});if(U.fromSale)S.draft.mech=d.name.trim()}
    U.fromSale=false;save();closeModal();render()},
  mi:f=>{const d=Object.fromEntries(new FormData(f));const name=d.name.trim();if(!name)return;
    const p=S.parts.find(x=>norm(x.name)===norm(name));const qty=Math.max(1,Math.round(num(d.qty))||1);let price=num(d.price);if(!price&&p)price=p.sell;
    if(price<=0)return toast('قیمت را وارد کن',1);
    if(p){const it=S.draft.items.find(x=>x.pid===p.id&&x.price===price);if(it)it.qty+=qty;else S.draft.items.push({pid:p.id,name:p.name,qty,price,buy:p.buy});
      const cur=S.draft.items.filter(x=>x.pid===p.id).reduce((s,x)=>s+x.qty,0);if(cur>p.stock){toast('موجودی کافی نیست ('+fa(p.stock)+' عدد)',1);sfx.err()}else sfx.add()}
    else{S.draft.items.push({pid:'',name,qty,price,buy:0});sfx.add()}
    save();render();setTimeout(()=>{const n=$('#mi [name=name]');if(n)n.focus()},0)},
  pay:f=>{const d=Object.fromEntries(new FormData(f)),amt=num(d.amount);if(amt<=0)return toast('مبلغ معتبر وارد کنید',1);
    S.payments.push({id:uid(),mech:f.dataset.id,amount:amt,note:d.note.trim(),date:Date.now()});save();sfx.done();render();showMech(f.dataset.id);toast('تسویه ثبت شد')},
  bp:f=>{const d=Object.fromEntries(new FormData(f));const pct=parseFloat(norm(d.pct).replace(',','.'))||0;if(!pct)return toast('درصد را وارد کن',1);
    const ids=d.scope?[d.scope,...desc(d.scope)]:null,rnd=+d.rnd||0,R=v=>rnd?Math.round(v/rnd)*rnd:Math.round(v);
    const list=S.parts.filter(p=>!ids||ids.includes(p.cat));if(!list.length)return toast('قطعه‌ای در این محدوده نیست',1);
    if(!confirm('قیمت '+fa(list.length)+' قطعه تغییر کند؟'))return;
    snapBulk();list.forEach(p=>{if(d.mode==='margin'){if(p.buy>0)p.sell=R(p.buy*(1+pct/100))}else{if(d.field!=='buy')p.sell=R(p.sell*(1+pct/100));if(d.field!=='sell')p.buy=R(p.buy*(1+pct/100))}});
    save();closeModal();render();toast('قیمت '+fa(list.length)+' قطعه تغییر کرد')},
  sf2:f=>{const d=Object.fromEntries(new FormData(f));Object.assign(S.settings,{shop:d.shop.trim()||'داروخانه ایرانخودرو',addr:d.addr.trim(),phone:d.phone.trim(),sound:!!d.sound,syncUrl:d.syncUrl.trim(),token:d.token.trim()});
    save();closeModal();render();pull()}
};
document.addEventListener('click',e=>{
  if(!e.target.closest('.sw'))$('#sr').hidden=true;
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.tagName==='A')e.preventDefault();
  const fn=A[b.dataset.act];if(fn)fn(b.dataset,b,e);
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&I[k])I[k](e.target)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.classList&&t.classList.contains('money')){const v=norm(t.value).replace(/\D/g,'');t.value=v?fmt(v):''}
  const k=t.dataset&&t.dataset.inp;if(k&&IP[k])IP[k](t)});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('man'))U.man=e.target.open},true);
document.addEventListener('submit',e=>{e.preventDefault();const h=H[e.target.id];if(h)h(e.target)});
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(tg.tagName);
  if(e.key==='F2'||(e.key==='/'&&!typing)){e.preventDefault();closeModal();const q=$('#q');q.focus();q.select();return}
  if(e.key==='F9'){e.preventDefault();if(S.ui.tab==='sale'&&!$('#mod'))finalize();return}
  if(e.key==='Escape'){if($('#mod'))closeModal();else{const q=$('#q');q.value='';renderSR();q.blur()}return}
  if(e.altKey&&/^Digit[1-6]$/.test(e.code)){e.preventDefault();closeModal();go(TABS[+e.code.slice(5)-1].id);return}
  if(e.key==='Enter'&&tg.name==='name'&&tg.form&&tg.form.id==='mi'){const f=tg.form;if(!S.parts.some(x=>norm(x.name)===norm(tg.value))&&!num(f.elements['price'].value)){const fs=$('#isug .sri');if(fs){e.preventDefault();A.pickname(fs.dataset)}}}
  if(e.key==='Enter'&&tg.id==='bc')e.preventDefault(); // بارکدخوان نباید فرم را ثبت کند
  if(e.key==='Enter'&&tg.classList&&tg.classList.contains('n')&&tg.dataset.in){tg.blur();$('#q').focus()}
});

/* ---------- شروع ---------- */
(async function boot(){
  let s=null;try{s=await DB.get('state')}catch{}
  S=s?hydrate(s):DEF();
  if(!s){seed();S.updatedAt=Date.now();try{await DB.set('state',S)}catch{}}
  else if((S.v||1)<2){if(isDemo()){S.cats=[];S.parts=[];S.mechs=S.mechs.filter(m=>m.id!=='m1')}ensureBranches();S.v=2;save()}
  render();pull();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  let seen=false;try{seen=!!localStorage.getItem('ih')}catch{}
  if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)&&location.protocol!=='file:'&&!seen){const d=document.createElement('div');d.className='card ih';d.innerHTML='<span>📲 نصب مثل برنامه: دکمه <b>Share</b> (مربع با فلش) ← <b>Add to Home Screen</b></span><button class="mini" data-act="ihx" aria-label="بستن">✕</button>';$('#view').before(d)}
  if(S.parts.length&&(!S.lastBackup||Date.now()-S.lastBackup>7*864e5))setTimeout(()=>toast('یادآوری: از ⚙️ تنظیمات پشتیبان بگیر'),3000);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
